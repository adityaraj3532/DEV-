<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ElectroShop</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#182433;font:16px system-ui}header{background:#102d36;color:white;padding:22px max(5vw,20px);display:flex;align-items:center;gap:18px;flex-wrap:wrap}header a{color:#a7eee1;text-decoration:none}h1{margin:0;font-size:24px}main{max-width:1180px;margin:30px auto;padding:0 20px}button{border:0;border-radius:9px;padding:11px 16px;background:#087f70;color:white;font:inherit;cursor:pointer}button:disabled{opacity:.45;cursor:default}input,select,textarea{width:100%;padding:12px;border:1px solid #cbd5df;border-radius:8px;font:inherit;margin:6px 0 14px}label{display:block;font-size:14px;font-weight:600}.card{background:white;border:1px solid #e1e6ec;padding:22px;border-radius:16px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.muted{color:#64748b}.price{font-size:25px;font-weight:750}img{width:100%;height:170px;object-fit:contain}#message{padding:15px;background:#e0f0eb;border-radius:10px;white-space:pre-wrap;margin-bottom:18px}#message:empty{display:none}.danger{background:#a32b3c}.secondary{background:#e4eeed;color:#174b43}nav{margin-left:auto;display:flex;gap:10px}small{color:#64748b}form{max-width:600px}.hidden{display:none}h2{font-size:28px}hr{border:0;border-top:1px solid #e1e6ec;margin:18px 0}button:focus-visible,a:focus-visible{outline:3px solid #ec9f2b;outline-offset:3px}
</style></head><body><header><h1>ElectroShop<span style="color:#8fe2cf">.</span></h1><a href="/">Shop</a><a href="/admin">Owner portal</a><nav id="navigation"></nav></header><main><div id="message" role="status"></div><section id="view"></section></main><script src="/app.js" defer></script></body></html>
