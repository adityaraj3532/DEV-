# Render blueprint: New > Blueprint, pick this repo. Fill the secret values in the Render dashboard.
services:
  - type: web
    name: dev-computer
    runtime: docker
    plan: starter            # a persistent disk needs a paid instance; free instances lose data on restart
    healthCheckPath: /api/health
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: ADMIN_KEY
        generateValue: true
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
